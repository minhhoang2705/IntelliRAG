apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intellirag-app-policy
  namespace: app
  labels:
    app.kubernetes.io/name: intellirag-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intellirag-app
  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow from NGINX Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000

  # Allow from same namespace (for debugging, internal health checks)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8000

  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8000

  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow Qdrant (same namespace)
  - to:
    - podSelector:
        matchLabels:
          app: qdrant
    ports:
    - protocol: TCP
      port: 6333

  # Allow external HTTPS (GCS, CloudFlare Tunnel for vLLM/embedding)
  - ports:
    - protocol: TCP
      port: 443

  # Allow HTTP (for CloudFlare Tunnel if using custom ports)
  - ports:
    - protocol: TCP
      port: 8080

  # Allow Jaeger tracing
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: UDP
      port: 6831
    - protocol: UDP
      port: 6832
