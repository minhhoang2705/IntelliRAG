apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intellirag-ingress
  namespace: app
  annotations:
    # cert-manager will use this issuer to provision TLS certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://blockchainradar.xyz, https://app.blockchainradar.xyz"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"

    # Rate Limiting (100 requests per minute per IP)
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"

    # Timeouts & Request Size
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.blockchainradar.xyz
    secretName: intellirag-tls  # cert-manager will create this secret
  rules:
  - host: api.blockchainradar.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: intellirag-app
            port:
              number: 8000
