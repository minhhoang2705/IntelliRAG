# Root Helmfile for IntelliRAG Observability Stack
# Orchestrates deployment of Prometheus, Grafana, Jaeger, and Loki

# Environment variables
environments:
  default:
    values:
      - grafana_admin_password: {{ requiredEnv "GRAFANA_ADMIN_PASSWORD" | default "changeme" }}
      - grafana_secret_key: {{ requiredEnv "GRAFANA_SECRET_KEY" | default "changeme" }}
      - prometheus_password: {{ requiredEnv "PROMETHEUS_PASSWORD" | default "changeme" }}

# Helmfiles to include (deployed in order)
helmfiles:
  # Deploy Prometheus first (metrics backend)
  - path: prometheus/helmfile.yaml
    selectors: []

  # Deploy Loki (logging backend)
  - path: loki/helmfile.yaml
    selectors: []

  # Deploy Jaeger (tracing backend)
  - path: jaeger/helmfile.yaml
    selectors: []

  # Deploy Grafana last (visualization layer)
  - path: grafana/helmfile.yaml
    selectors: []

# Pre-sync hooks
hooks:
  - events: ["presync"]
    showlogs: true
    command: "kubectl"
    args:
      - "apply"
      - "-f"
      - "namespace.yaml"

  - events: ["presync"]
    showlogs: true
    command: "bash"
    args:
      - "-c"
      - |
        echo "Creating Grafana dashboard ConfigMap..."
        kubectl create configmap grafana-dashboards-intellirag \
          --from-file=../../observability/grafana/provisioning/dashboards/json/ \
          --namespace=observability \
          --dry-run=client -o yaml | kubectl apply -f -

  - events: ["postsync"]
    showlogs: true
    command: "bash"
    args:
      - "-c"
      - |
        echo "========================================"
        echo "Observability Stack Deployment Complete!"
        echo "========================================"
        echo ""
        echo "Access URLs:"
        echo "  - Grafana:    http://grafana.intellirag.local"
        echo "  - Prometheus: http://prometheus.intellirag.local"
        echo "  - Jaeger UI:  http://jaeger.intellirag.local"
        echo "  - Loki:       http://loki.intellirag.local"
        echo ""
        echo "Default Credentials:"
        echo "  - Grafana Admin: admin / $GRAFANA_ADMIN_PASSWORD"
        echo ""
        echo "Verify deployments:"
        echo "  kubectl get pods -n observability"
        echo ""

# Common labels
commonLabels:
  app.kubernetes.io/part-of: intellirag
  app.kubernetes.io/managed-by: helmfile

# Helmfile sync options
helmDefaults:
  wait: true
  timeout: 600
  atomic: true
  cleanupOnFail: true
  force: false
  recreatePods: false
