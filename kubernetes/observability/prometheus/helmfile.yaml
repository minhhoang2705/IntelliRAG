repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

releases:
  - name: prometheus
    namespace: observability
    chart: prometheus-community/kube-prometheus-stack
    version: 65.10.0
    values:
      - values.yaml
    wait: true
    timeout: 900
    atomic: true
    cleanupOnFail: true
    # Create CRDs first
    set:
      - name: crds.enabled
        value: true
