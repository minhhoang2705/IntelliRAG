# Kube-Prometheus-Stack Helm Chart Values for IntelliRAG
# Reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# Prometheus Operator
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Prometheus Server
prometheus:
  enabled: true
  prometheusSpec:
    # Retention and storage
    retention: 30d
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
          storageClassName: standard

    # Resource limits
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 1
        memory: 2Gi

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Additional scrape configs for IntelliRAG
    additionalScrapeConfigs:
      # IntelliRAG API metrics
      - job_name: 'intellirag-metrics'
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets:
              - 'intellirag-service.default.svc.cluster.local:8000'
        metrics_path: '/metrics'
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - target_label: job
            replacement: 'intellirag'

      # vLLM metrics (if exposed)
      - job_name: 'vllm-metrics'
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets:
              - 'vllm-service.default.svc.cluster.local:8000'
        metrics_path: '/metrics'
        relabel_configs:
          - target_label: job
            replacement: 'vllm'

      # Qdrant metrics
      - job_name: 'qdrant-metrics'
        scrape_interval: 30s
        static_configs:
          - targets:
              - 'qdrant.default.svc.cluster.local:6333'
        metrics_path: '/metrics'

    # External labels for alerting
    externalLabels:
      cluster: intellirag
      environment: production

# Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Alertmanager configuration
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: ''  # Set via secret

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      - name: 'null'
      - name: 'critical-alerts'
        # Configure your notification channels here
        # slack_configs:
        #   - channel: '#alerts-critical'
        #     title: 'Critical Alert'
      - name: 'warning-alerts'
        # slack_configs:
        #   - channel: '#alerts-warning'
        #     title: 'Warning Alert'

# Grafana (will be deployed separately)
grafana:
  enabled: false

# Node Exporter for system metrics
nodeExporter:
  enabled: true

# Kube State Metrics
kubeStateMetrics:
  enabled: true

# Default rules (monitoring alerts)
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Additional PrometheusRules for IntelliRAG
additionalPrometheusRulesMap:
  intellirag-rules:
    groups:
      - name: intellirag_critical
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{job="intellirag"} == 0
            for: 1m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "IntelliRAG service is down"
              description: "{{ $labels.instance }} has been down for more than 1 minute"

          - alert: HighErrorRate
            expr: rate(http_requests_total{job="intellirag",status_code=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }}"

# Service Monitors
serviceMonitor:
  enabled: true
