# Grafana Helm Chart Values for IntelliRAG
# Reference: https://github.com/grafana/helm-charts/tree/main/charts/grafana

# Persistence
persistence:
  enabled: true
  type: pvc
  size: 10Gi
  storageClassName: standard
  accessModes:
    - ReadWriteOnce

# Admin credentials
adminUser: admin
adminPassword: ${GRAFANA_ADMIN_PASSWORD:-changeme}

# Resources
resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Datasources (Prometheus, Loki, Jaeger)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 30s
          queryTimeout: 60s
          httpMethod: POST

      - name: Loki
        type: loki
        url: http://loki-gateway.observability.svc.cluster.local
        access: proxy
        editable: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceName: Jaeger
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: '$${__value.raw}'
              urlDisplayLabel: 'View Trace'

      - name: Jaeger
        type: jaeger
        url: http://jaeger-query.observability.svc.cluster.local:16686
        access: proxy
        editable: true
        jsonData:
          tracesToLogs:
            datasourceUid: 'loki'
            tags: ['trace_id', 'span_id']
            mappedTags: [{ key: 'trace_id', value: 'trace_id' }]
            mapTagNamesEnabled: true
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            filterByTraceID: true
            filterBySpanID: false

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'intellirag'
        orgId: 1
        folder: 'IntelliRAG'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/intellirag

# Dashboard ConfigMaps
dashboardsConfigMaps:
  intellirag: "grafana-dashboards-intellirag"

# Ingress
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana.intellirag.local
  path: /
  pathType: Prefix
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.intellirag.local

# Grafana configuration
grafana.ini:
  server:
    root_url: https://grafana.intellirag.local
    serve_from_sub_path: false

  auth:
    disable_login_form: false
    disable_signout_menu: false

  auth.anonymous:
    enabled: false

  users:
    allow_sign_up: false
    auto_assign_org: true
    auto_assign_org_role: Viewer

  security:
    admin_user: admin
    admin_password: ${GRAFANA_ADMIN_PASSWORD}
    secret_key: ${GRAFANA_SECRET_KEY}

  analytics:
    reporting_enabled: false
    check_for_updates: true

  log:
    mode: console
    level: info

  alerting:
    enabled: true

  unified_alerting:
    enabled: true

  metrics:
    enabled: true
    basic_auth_username: prometheus
    basic_auth_password: ${PROMETHEUS_PASSWORD}

# Plugins to install
plugins:
  - grafana-piechart-panel
  - grafana-clock-panel

# Service account
serviceAccount:
  create: true
  name: grafana

# RBAC
rbac:
  create: true
  pspEnabled: false

# Monitoring
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
