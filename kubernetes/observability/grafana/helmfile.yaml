repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: grafana
    namespace: observability
    chart: grafana/grafana
    version: 8.8.2
    values:
      - values.yaml
    wait: true
    timeout: 600
    atomic: true
    cleanupOnFail: true
    # Hooks to create dashboard ConfigMaps
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "create"
          - "configmap"
          - "grafana-dashboards-intellirag"
          - "--from-file=../../../observability/grafana/provisioning/dashboards/json/"
          - "--namespace=observability"
          - "--dry-run=client"
          - "-o"
          - "yaml"
          - "|"
          - "kubectl"
          - "apply"
          - "-f"
          - "-"
