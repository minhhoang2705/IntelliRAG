# Jaeger Helm Chart Values for IntelliRAG
# Reference: https://github.com/jaegertracing/helm-charts

provisionDataStore:
  cassandra: false
  elasticsearch: true
  kafka: false

storage:
  type: elasticsearch
  elasticsearch:
    host: elasticsearch-master
    port: 9200
    scheme: http
    user: elastic
    usePassword: false
    nodesWanOnly: false

# Jaeger Agent (receives traces from applications)
agent:
  enabled: true
  daemonset:
    enabled: true
    hostPort: 6831
    useHostNetwork: false
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Jaeger Collector (receives from agents, writes to storage)
collector:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    zipkin:
      port: 9411
    grpc:
      port: 14250
    http:
      port: 14268
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Jaeger Query (UI and API for viewing traces)
query:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 16686
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: jaeger.intellirag.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: jaeger-tls
        hosts:
          - jaeger.intellirag.local

# Elasticsearch for trace storage
elasticsearch:
  enabled: true
  replicas: 2
  minimumMasterNodes: 1
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 50Gi
  esJavaOpts: "-Xmx2g -Xms2g"

# Span storage schema
schema:
  create: true
  # Retention period in days
  ttl:
    enabled: true
    days: 7

# Sampling configuration
sampling:
  strategies: |
    {
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      },
      "service_strategies": [
        {
          "service": "intellirag-api",
          "type": "probabilistic",
          "param": 0.5
        }
      ]
    }
