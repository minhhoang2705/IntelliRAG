# Loki Stack Helm Chart Values for IntelliRAG
# Reference: https://github.com/grafana/loki/tree/main/production/helm/loki

loki:
  auth_enabled: false

  server:
    http_listen_port: 3100
    grpc_listen_port: 9096

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    retention_period: 168h  # 7 days
    enforce_metric_name: false
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_length: 721h  # 30 days
    max_query_parallelism: 32
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

  schema_config:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  ruler:
    storage:
      type: local
      local:
        directory: /var/loki/rules
    rule_path: /tmp/loki/rules-temp
    alertmanager_url: http://prometheus-kube-prometheus-alertmanager:9093
    ring:
      kvstore:
        store: inmemory

  ingester:
    chunk_idle_period: 30m
    chunk_block_size: 262144
    chunk_retain_period: 1m
    max_chunk_age: 1h
    chunk_encoding: snappy
    wal:
      enabled: true
      dir: /var/loki/wal

  storage_config:
    hedging:
      at: 250ms
      max_per_second: 20
      up_to: 3

# Loki deployment configuration
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 2
      memory: 2Gi
    requests:
      cpu: 1
      memory: 1Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: standard

# Gateway (NGINX)
gateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: loki.intellirag.local
        paths:
          - path: /
            pathType: Prefix

# Promtail for log collection
promtail:
  enabled: true
  config:
    clients:
      - url: http://{{ .Release.Name }}-gateway/loki/api/v1/push

    positions:
      filename: /tmp/positions.yaml

    snippets:
      pipelineStages:
        # Extract JSON fields from structured logs
        - docker: {}
        - json:
            expressions:
              level: level
              message: message
              trace_id: trace_id
              span_id: span_id
              timestamp: timestamp
              service: service
              endpoint: endpoint
              method: method
              status_code: status_code

        # Add labels for better querying
        - labels:
            level:
            trace_id:
            span_id:
            service:
            endpoint:

        # Filter out health check logs
        - match:
            selector: '{endpoint="/health"}'
            action: drop

      scrapeConfigs: |
        # Scrape all pod logs in the default namespace
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_container_name]
              target_label: container
          pipeline_stages:
            - docker: {}
            - json:
                expressions:
                  level: level
                  trace_id: trace_id
                  span_id: span_id
            - labels:
                level:
                trace_id:
                span_id:

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Service account
serviceAccount:
  create: true
  name: loki
