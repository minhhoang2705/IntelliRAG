apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: embedding-bge-m3
  namespace: intellirag
  labels:
    app: intellirag
    component: embedding
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
    - name: kserve-container
      # Build this image from deploy/embedding-service/
      # Command: docker build -t intellirag-embedding:latest deploy/embedding-service/
      # Then: minikube image load intellirag-embedding:latest
      image: intellirag-embedding:latest
      imagePullPolicy: Never  # Use local image (for minikube)
      env:
        - name: EMBEDDING_MODEL
          value: BAAI/bge-m3
        - name: DEVICE
          value: cuda
        - name: MAX_BATCH_SIZE
          value: "128"
        - name: HF_TOKEN
          value: ""  # Add HuggingFace token if needed
      ports:
        - containerPort: 8001
          protocol: TCP
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "1"
          memory: 2Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: huggingface-cache
          mountPath: /root/.cache/huggingface
      readinessProbe:
        httpGet:
          path: /health
          port: 8001
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8001
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
    volumes:
      - name: huggingface-cache
        hostPath:
          path: /home/minh-ubs-k8s/.cache/huggingface
          type: DirectoryOrCreate

