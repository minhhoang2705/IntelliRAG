[project]
name = "intellirag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.4.0",
    "chardet>=5.2.0",
    "docling>=2.55.1",
    "docling-core>=2.48.4",
    "fastapi>=0.118.0",
    "gcloud-aio-storage>=9.6.0",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "langchain-text-splitters>=0.3.11",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "prometheus-client>=0.23.1",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.11.0",
    "pymupdf>=1.26.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.0.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.15.1",
    "sentence-transformers>=5.1.1",
    "tdd-guard-pytest>=0.1.2",
    "transformers>=4.57.0",
    "uvicorn>=0.37.0",
]

[tool.pytest.ini_options]
tdd_guard_project_root = "/home/minh-ubs-k8s/AIDE-1/capstone/IntelliRAG"
markers = [
    "unit: Unit tests with mocked dependencies",
    "integration: Integration tests with real services (Qdrant, model)",
    "benchmark: Performance benchmarking tests",
    "slow: Tests that take >10 seconds",
]
