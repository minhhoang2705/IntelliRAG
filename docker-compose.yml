version: '3.8'

services:
  # Qdrant Vector Database (existing)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: intellirag-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - intellirag-network

volumes:
  qdrant_data:
    driver: local

networks:
  intellirag-network:
    driver: bridge
