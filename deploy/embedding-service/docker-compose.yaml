version: '3.8'

services:
  embedding-service:
    build: .
    container_name: intellirag-embedding
    runtime: nvidia  # Enable NVIDIA GPU support
    
    ports:
      - "8001:8001"
    
    environment:
      # Configurable model - change this to swap models!
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - DEVICE=${DEVICE:-cpu}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-128}
      # HuggingFace token for gated models (optional)
      - HF_TOKEN=${HF_TOKEN:-}
      # GPU Configuration (when using cuda)
      - CUDA_VISIBLE_DEVICES=0
    
    volumes:
      # Cache HuggingFace models to avoid re-downloading
      - ~/.cache/huggingface:/root/.cache/huggingface
    
    deploy:
      resources:
        limits:
          memory: 4G  # BGE-M3 needs ~2-3GB, extra for processing
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              device_ids: ['0']  # Use first GPU
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model loading takes ~30-60s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

